name: 실행판 만들기

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Build executable
        env:
          PYTHONUTF8: "1"
        run: python build-native.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KarisBulletin-2.0-${{ runner.os }}
          path: KarisBulletin-2.0-*.zip
